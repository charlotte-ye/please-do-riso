<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Riso Effect Web</title>

  <link rel="stylesheet" href="style.css">

  <script src="https://cdn.jsdelivr.net/npm/p5@1.9.0/lib/p5.min.js"></script>
  <script src="p5.riso.js"></script>
</head>

<body>
  <header class="site-header">
    <div class="nav-wrapper">
      <div class="logo">please do riso</div>

      <nav class="nav-menu" aria-label="Page navigation">
        <a href="#controls">Upload</a>
        <a href="#controls">Colors</a>
        <a href="#canvas-holder">Generate</a>
      </nav>
    </div>
  </header>

  <main class="riso-page">
    <section id="controls">
      <h1>please do riso</h1>

      <p class="intro">
        Upload an image, choose Riso colors, and make your own print preview.
      </p>

      <div class="control-panel">
        <div class="control-group">
          <label for="upload">Upload Image</label>
          <input type="file" id="upload" accept="image/png,image/jpeg,image/webp,image/gif">
        </div>

        <div class="select-group">
          <label for="color1">Layer 1</label>
          <select id="color1">
            <option value="fluorescentpink" selected>fluorescentpink</option>
            <option value="yellow">yellow</option>
            <option value="teal">teal</option>
            <option value="blue">blue</option>
            <option value="lightlime">lightlime</option>
            <option value="orange">orange</option>
            <option value="black">black</option>
          </select>
        </div>

        <div class="select-group">
          <label for="color2">Layer 2</label>
          <select id="color2">
            <option value="yellow" selected>yellow</option>
            <option value="fluorescentpink">fluorescentpink</option>
            <option value="teal">teal</option>
            <option value="blue">blue</option>
            <option value="lightlime">lightlime</option>
            <option value="orange">orange</option>
            <option value="black">black</option>
          </select>
        </div>

        <div class="range-group">
          <label for="dotSize">Dot Size</label>
          <input type="range" id="dotSize" min="4" max="18" value="8" step="1">
        </div>

        <div class="select-group ratio-group">
          <label for="canvasRatio">Canvas Ratio</label>
          <select id="canvasRatio">
            <option value="square" selected>Square · 1:1</option>
            <option value="landscape">Landscape · 4:3</option>
            <option value="portrait">Portrait · 3:4</option>
          </select>
        </div>

        <div class="background-group">
          <label for="backgroundColor">Background</label>

          <div class="background-options">
            <input type="color" id="backgroundColor" value="#fcfaf0" aria-label="Choose a custom background color">
            <button class="color-swatch" type="button" data-background="#ffffff" style="--swatch-color: #ffffff" aria-label="White background" title="White"></button>
            <button class="color-swatch" type="button" data-background="#e2edce" style="--swatch-color: #e2edce" aria-label="Light green background" title="#e2edce"></button>
            <button class="color-swatch" type="button" data-background="#dbecdf" style="--swatch-color: #dbecdf" aria-label="Mint background" title="#dbecdf"></button>
            <button class="color-swatch selected" type="button" data-background="#fcfaf0" style="--swatch-color: #fcfaf0" aria-label="Warm white background" title="#fcfaf0"></button>
            <button class="color-swatch transparent-swatch" type="button" data-background="transparent" aria-label="Transparent background" title="Transparent"></button>
          </div>
        </div>

        <div class="action-group">
          <button id="generateBtn" type="button">Generate Riso Effect</button>
          <button id="saveBtn" class="secondary-button" type="button" disabled>Save PNG</button>
        </div>
      </div>

      <p class="hint">
        Upload image · generate once · adjust colors, dots, ratio and background live · save PNG
      </p>
    </section>

    <section id="canvas-holder" aria-label="Riso effect preview"></section>
  </main>

  <div class="signature">yuchandesu</div>

  <script src="sketch.js"></script>
</body>
</html>
